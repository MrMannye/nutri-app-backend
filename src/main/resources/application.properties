# Hibernate naming strategies
# These settings are used to ensure that the naming conventions used in the application match those expected by the database.
# ImplicitNamingStrategyLegacyJpaImpl is used to maintain compatibility with legacy JPA naming conventions.
# PhysicalNamingStrategyStandardImpl is used to apply standard naming conventions for physical database names
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

